appId: dev.arbora.app
productName: Arbora
executableName: arbora
copyright: Copyright © 2026 Arbora
artifactName: arbora-${version}-${os}-${arch}.${ext}
# The workspace package is scoped (@arbora/desktop); installers need a plain name.
extraMetadata:
  name: arbora

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - '!**/*.map'

# React/Vue DevTools for the browser panel, fetched and verified by scripts/fetch-devtools-extensions.mjs.
extraResources:
  - from: resources/extensions
    to: extensions
    filter:
      - '*/**'

# Native modules (node-pty) must live outside the asar so they can be loaded and signed; node-pty
# also execs its `spawn-helper` binary on macOS.
asarUnpack:
  - '**/*.node'
  - '**/node-pty/**/spawn-helper'

# GitHub Releases of the public `arbora-releases` repository feed electron-updater and the website's
# download page; the source repository stays private. `pnpm package` passes `--publish never`; the
# release workflow passes `--publish always`, which uploads to a draft release there.
publish:
  provider: github
  owner: maplepreneur
  repo: arbora-releases
  releaseType: draft
# `x.y.z-beta.n` builds write beta.yml as well, so the beta channel also sees stable releases.
generateUpdatesFilesForAllChannels: true

linux:
  target:
    - AppImage
    - deb
    - tar.gz
  category: Development
  executableName: arbora
  syncDesktopName: true
  maintainer: Arbora <hello@arbora.dev>
  synopsis: Design mode for coding agents
  desktop:
    entry:
      StartupWMClass: arbora

deb:
  # Notifications go through libnotify; safeStorage uses the Secret Service when there is one.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
  recommends:
    - git
    - ripgrep

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # Signed when CSC_LINK / CSC_KEY_PASSWORD hold a Developer ID certificate; unsigned otherwise
  # (CSC_IDENTITY_AUTO_DISCOVERY=false). See docs/RELEASING.md.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Uses APPLE_API_KEY, APPLE_API_KEY_ID and APPLE_API_ISSUER (App Store Connect API key) when set;
  # electron-builder skips notarization without them.
  notarize: true

dmg:
  sign: false

win:
  target:
    - target: nsis
      arch: [x64]
  # Signed when WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD (or Azure Trusted Signing, see docs/RELEASING.md)
  # are set; until then the installer is unsigned and SmartScreen warns once.

nsis:
  oneClick: false
  # Per-user install: electron-updater cannot update a per-machine install without admin rights.
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
