<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arbora fixture: login</title>
  </head>
  <body>
    <form id="login">
      <label>Email <input name="user" type="email" autocomplete="username" /></label>
      <label>Password <input name="pass" type="password" autocomplete="current-password" /></label>
      <button type="submit">Sign in</button>
    </form>
    <p id="out"></p>
    <script>
      document.getElementById('login').addEventListener('submit', (event) => {
        event.preventDefault();
        const user = document.querySelector('input[name="user"]').value;
        const pass = document.querySelector('input[type="password"]').value;
        const otp = document.querySelector('input[name="otp"]');
        const out = document.getElementById('out');
        if (user !== 'ada@example.com' || pass !== 's3cret-fixture-value') {
          out.textContent = 'denied';
          return;
        }
        if (!otp) {
          const code = document.createElement('input');
          code.name = 'otp';
          code.type = 'text';
          code.autocomplete = 'one-time-code';
          document.getElementById('login').appendChild(code);
          out.textContent = 'need-code';
          return;
        }
        out.textContent = otp.value === '918273' ? 'welcome' : 'denied';
      });
    </script>
  </body>
</html>
