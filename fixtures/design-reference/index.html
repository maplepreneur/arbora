<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arbora fixture: design reference</title>
    <link
      rel="icon"
      href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=="
    />
    <style>
      html,
      body {
        margin: 0;
        background: #f3f0e8;
        color: #1c1915;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      header {
        height: 140px;
        background: #1f6b4a;
        color: #fff;
        display: flex;
        align-items: center;
        padding: 0 40px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 32px;
        line-height: 1.2;
        font-weight: 700;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        padding: 40px;
      }
      section {
        width: 360px;
        background: #fff;
        border-radius: 16px;
        padding: 24px;
        box-sizing: border-box;
      }
      h2 {
        margin: 0;
        font-size: 20px;
        line-height: 1.2;
        font-weight: 700;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      p {
        margin: 12px 0 0;
        font-size: 16px;
        line-height: 1.2;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      button {
        margin-top: 20px;
        background: #1f6b4a;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font: 700 16px/1.2 ui-sans-serif, system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <header><h1>Design reference</h1></header>
    <main>
      <section>
        <h2>Counter</h2>
        <p>Clicked 0 times</p>
        <button type="button">Increment</button>
      </section>
    </main>
  </body>
</html>
