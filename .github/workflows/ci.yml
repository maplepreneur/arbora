name: CI

# The repo is private, so Actions minutes are billed: macOS at 10x and Windows at 2x Linux.
# Every run checks Linux only. macOS and Windows run when a PR has the `ci:all-os` label, or
# from "Run workflow" with "all_os" ticked. Docs-only changes and draft PRs skip CI.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', '.cursor/**', 'LICENSE']
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths-ignore: ['**/*.md', 'docs/**', '.cursor/**', 'LICENSE']
  workflow_dispatch:
    inputs:
      all_os:
        description: Also run on macOS and Windows
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI (${{ matrix.os }})
    # Skip drafts, and labels other than `ci:all-os` (adding one must not rerun everything).
    if: >-
      github.event.pull_request.draft != true &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:all-os')
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(
            ((github.event_name == 'workflow_dispatch' && inputs.all_os) ||
              contains(github.event.pull_request.labels.*.name, 'ci:all-os'))
            && '["ubuntu-latest","macos-latest","windows-latest"]'
            || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # `install-electron` downloads the Electron binary on every install otherwise.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Fetch DevTools extensions
        run: pnpm --filter @arbora/desktop extensions --optional
      - run: pnpm build:test
      - name: Playwright (Linux, Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @arbora/desktop exec playwright test
      - name: Playwright
        if: runner.os != 'Linux'
        run: pnpm --filter @arbora/desktop exec playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results-${{ matrix.os }}
          path: |
            apps/desktop/test-results
            apps/desktop/playwright-report
          retention-days: 7
